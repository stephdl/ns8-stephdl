name: repomd
on: 
  push:
    branches: main
  workflow_dispatch:
  schedule:
  - cron:  '25 0,6,12,18 * * *'

# The job only pushes the repomd branch, so the token gets nothing else.
permissions:
  contents: write

jobs:
  repomd:
    runs-on: ubuntu-latest
    steps:
    - id: checkout
      uses: actions/checkout@v3

    - id: buildmd
      run: |
        bash createrepo.sh

    - id: lpublish
      name: "Publish metadata on GitHub"
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git config user.name nethbot
        git config user.email nethbot@nethesis.it
        BRANCH=$(basename ${{ github.ref }})
        COMMIT_MESSAGE="repomd@$BRANCH"
        REMOTE_BRANCH="repomd"
        mkdir -vp .dst/ns8/updates/
        mv -v repodata.json .dst/ns8/updates
        cp -av $(ls -d */) .dst/ns8/updates/
        cp -av .site/. .dst/
        sed -i "s/__GENERATED__/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" .dst/index.html
        touch .dst/.nojekyll
        # The website hides its activity section when this file is missing, so a failed query must not stop the publish.
        if ! gh api graphql -f login="${{ github.repository_owner }}" -f query='
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                totalCommitContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
                totalIssueContributions
                restrictedContributionsCount
                contributionCalendar { totalContributions weeks { contributionDays { date contributionCount } } }
              }
            }
          }' | jq '.data.user.contributionsCollection + {updated: (now | todate)}' > .dst/activity.json; then
          echo "::warning::GitHub activity could not be collected"
          rm -f .dst/activity.json
        fi
        echo forge.de-labrusse.fr > .dst/CNAME
        git add .dst/
        TREE=$(git write-tree --prefix=.dst)
        COMMIT=$(git commit-tree -m "${COMMIT_MESSAGE}" ${TREE})
        git push -f origin $COMMIT:refs/heads/${REMOTE_BRANCH}
        {
          echo "Repository metadata has been published to"
          echo ""
          echo "https://raw.githubusercontent.com/${{ github.repository }}/${REMOTE_BRANCH}/repodata.json"
          echo ""
          echo "Source"
          echo ""
          echo "https://github.com/${{ github.repository }}/tree/${REMOTE_BRANCH}"
          echo ""
        } >> $GITHUB_STEP_SUMMARY
